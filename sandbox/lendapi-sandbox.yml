  tooling: none published
self_service:
  signup_url: https://app.lendapi.com/login/
  notes: >-
    Access is commercial -- the pricing page routes to "Contact Us" for both the LOS
    and Embarc LMS products, so test credentials are provisioned through sales rather
    than by open self-service signup.
