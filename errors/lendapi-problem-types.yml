format_notes: >-
  LendAPI does not use RFC 9457 problem+json. Every documented error response is a
  bare application/json 400 with an empty object schema and an example of "{}".
  There is no published error-code registry, no error `type` URIs, and no
  machine-readable error taxonomy. The only structured failure semantics LendAPI
  publishes are application DECISION outcomes (application.declined /
  application.review), which are delivered as webhook events rather than as HTTP
  errors -- see asyncapi/lendapi-webhooks.yml.
