- target: $.info
  update:
    description: >-
      LendAPI is a no-code / low-code loan origination and account-opening platform.
      This REST API drives the same primitives the Product Studio exposes: create and
      advance applications, run versioned decision trees and pricing engines, manage
      tenant-defined variables and sub-tenants, pull bureau credit reports, compute
      amortization schedules, and score credit risk. Authentication is an API key in
      the AUTHORIZATION header formatted as a bearer token; the key also selects test
      versus live mode.
