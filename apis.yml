aid: lendapi
name: LendAPI
description: >-
  LendAPI is a no-code / low-code loan origination and digital account-opening platform
  for banks, credit unions, fintechs and embedded-finance programs. Its Product Studio
  lets teams assemble a lending product -- application form, underwriting logic, pricing
  and servicing -- without writing code, backed by a versioned decision engine, a
  versioned pricing engine, DocAI document processing, UnderwriteAI and ARC AI scoring,
  KYC/KYB verification, two-way SMS, virtual cards and the Embarc loan management
  system. A marketplace of pre-integrated data partners covers credit bureaus, identity
  verification, open banking, cash-flow analytics and income verification. The REST API
  documented at developer.lendapi.com exposes the same primitives programmatically:
  create and advance applications, run decisions and pricing, manage tenant-defined
  variables and sub-tenants, pull bureau credit reports, compute amortization schedules
  and score credit risk. LendAPI is SOC 2 Type 2 attested and serves use cases across
  point-of-sale finance, buy-now-pay-later, auto lending, fix-and-flip, retail in-store
  lending and embedded finance.
